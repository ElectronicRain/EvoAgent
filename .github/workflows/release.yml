name: Release EvoAgent Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Test frontend
        working-directory: frontend
        run: pnpm build
      - name: Test backend
        run: .\.venv\Scripts\python.exe -m pytest -q
      - name: Prepare bundled LaTeX runtime
        run: .\scripts\prepare_tectonic.ps1
      - name: Build backend sidecar
        run: .\scripts\build_backend.ps1
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tagName: v__VERSION__
          releaseName: "EvoAgent v__VERSION__"
          releaseBody: |
            ## EvoAgent V2.1.1

            - 完整发布学习空间与计算机科学学科包，支持方向独立画像、五维诊断、动态学习路径、可追溯问答、导师学伴、错题闭环与个性化空间。
            - 完整发布科研应用层，覆盖文献研究、参考文献关联图谱、Idea 实验室、科研记忆与实验承接、LaTeX 协作写作、多角色模拟审稿、领域前沿追踪和科研数据图表。
            - 科研与学习模块均可调用 Agent 工厂、专业知识库、RAG、工作流、Skill 和智能评测等底层能力。
            - 修复 Windows“检查更新”无响应与 API 地址易受限流影响的问题，更新清单改用 GitHub Release 稳定直链。
            - 安装包与更新清单均带发布签名；升级不会覆盖本地数据库、密钥、工作区、Skills 和插件。
          releaseDraft: false
          prerelease: false
      - name: Publish rate-limit-free updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content "frontend/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $downloadBase = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag"
          $manifestPath = Join-Path $env:RUNNER_TEMP "latest.json"
          $manifestUrl = "$downloadBase/latest.json"

          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              Invoke-WebRequest -UseBasicParsing -Uri $manifestUrl -OutFile $manifestPath -TimeoutSec 30
              break
            } catch {
              if ($attempt -eq 12) { throw }
              Start-Sleep -Seconds 5
            }
          }

          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $msiUrl = "$downloadBase/EvoAgent_${version}_x64_en-US.msi"
          $nsisUrl = "$downloadBase/EvoAgent_${version}_x64-setup.exe"
          $manifest.platforms.'windows-x86_64'.url = $msiUrl
          $manifest.platforms.'windows-x86_64-msi'.url = $msiUrl
          $manifest.platforms.'windows-x86_64-nsis'.url = $nsisUrl
          $json = $manifest | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText($manifestPath, $json, [System.Text.UTF8Encoding]::new($false))

          gh release upload $tag $manifestPath --clobber --repo $env:GITHUB_REPOSITORY

          $cacheKey = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $published = Invoke-RestMethod -Uri "$manifestUrl?cache=$cacheKey" -TimeoutSec 30
          foreach ($platform in $published.platforms.PSObject.Properties) {
            if ($platform.Value.url -like 'https://api.github.com/*') {
              throw "Updater manifest still contains a rate-limited API URL for $($platform.Name)."
            }
            if ([string]::IsNullOrWhiteSpace($platform.Value.signature)) {
              throw "Updater manifest is missing a signature for $($platform.Name)."
            }
            $asset = Invoke-WebRequest -UseBasicParsing -Method Head -Uri $platform.Value.url -MaximumRedirection 5 -TimeoutSec 30
            if ($asset.StatusCode -ne 200) {
              throw "Updater asset is unavailable for $($platform.Name): HTTP $($asset.StatusCode)."
            }
          }
