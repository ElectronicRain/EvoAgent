[package]
name = "evoagent-desktop"
version = "2.1.1"
description = "EvoAgent Windows desktop application"
authors = ["EvoAgent Team"]
edition = "2021"

[lib]
name = "evoagent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
